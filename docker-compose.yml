services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-theke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-theke}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-theke}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    # Build context is the repo root (not ./backend) so the Dockerfile can
    # also COPY shared/theke_shared - pure logic shared with the crawler
    # service (see KNOWN_DECISIONS.md's "crawler/backend discovery-logic
    # duplication" entry). Everything else about this build is unchanged.
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Bind-mounted separately, and after ./backend:/app, so live-reload
      # dev edits to the shared module are picked up too - without this the
      # image's build-time COPY of shared/theke_shared would be hidden
      # under the ./backend:/app mount above.
      - ./shared/theke_shared:/app/theke_shared
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  crawler:
    # See backend's build comment above - same repo-root-context reason.
    build:
      context: .
      dockerfile: crawler/Dockerfile
    env_file: .env
    volumes:
      - ./crawler:/app
      - ./shared/theke_shared:/app/theke_shared
    profiles:
      - crawler
    depends_on:
      postgres:
        condition: service_healthy

  # Runs the same crawler image continuously, executing crawler/main.py on
  # the schedule defined in crawler/crontab (monthly by default). No Docker
  # socket mounting required - supercronic runs the job in-process.
  # depends_on backend too: the weekly canary_benchmark job (crawler/crawler/
  # canary_benchmark.py) calls POST /chat/message over HTTP, unlike the
  # other scheduled jobs which only ever talk to Postgres directly.
  scheduler:
    # Same repo-root-context reason as backend/crawler above. No shared-dir
    # bind mount needed here - this service never bind-mounts its own code
    # either (see the uploads_data comment below), so it always runs from
    # whatever was baked into the image at build time.
    build:
      context: .
      dockerfile: crawler/Dockerfile
    env_file: .env
    command: ["supercronic", "/app/crontab"]
    # Same uploads_data volume the backend service mounts, at the same
    # /app/uploads path - crawler/crawler/retention_cleanup.py needs to
    # physically remove a deleted company's uploaded files, not just their
    # DB rows, and this is the only container that job runs in. Without this
    # mount the job would still delete the DB rows correctly but silently
    # leave every file orphaned on disk - see that file's module docstring.
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
